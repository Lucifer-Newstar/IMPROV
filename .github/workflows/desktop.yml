name: Desktop build

# Produces installers for Windows / macOS / Linux via Tauri.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Artifacts are attached to the GitHub Release for that tag.
# Manual runs are available from the Actions tab (artifacts only).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tauri:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux (deb, AppImage)
            args: ""
          - os: windows-latest
            label: Windows (nsis, msi)
            args: ""
          - os: macos-latest
            label: macOS (dmg, app)
            args: "--target aarch64-apple-darwin"

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux bundling dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: Frontend/src-tauri -> target

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Frontend
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "IMPROV ${{ github.ref_name }}"
          releaseBody: "Desktop builds of IMPROV. See the repository README for install notes."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
