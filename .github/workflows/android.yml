name: Android build

# Builds a signed release APK/AAB via Capacitor.
#
# Signing: a release build needs a keystore. Until you create one, this
# workflow produces an *unsigned* release artifact and a debug APK — both
# installable for testing. See docs/MOBILE_DESKTOP.md.
#
# Required secrets once you have a keystore:
#   ANDROID_KEYSTORE_BASE64   base64 -w0 release.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build APK / AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Capacitor's generated Gradle project targets Java 21.
          java-version: "21"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Capacitor CLI
        working-directory: Frontend
        run: npm install

      - name: Add the Android platform (first run only)
        working-directory: Frontend
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already present"
          fi

      - name: Sync web assets into the native project
        working-directory: Frontend
        run: npx cap sync android

      - name: Decode the keystore
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: Frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "path=$(pwd)/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: Frontend/android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The generated build.gradle has a release block that reads these
          # properties. Missing properties simply skip signing, so the build
          # still succeeds without a keystore.
          {
            echo "IMPROV_KEYSTORE=$KEYSTORE_PATH"
            echo "IMPROV_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "IMPROV_KEY_ALIAS=$KEY_ALIAS"
            echo "IMPROV_KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Assemble debug APK
        working-directory: Frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Bundle release
        working-directory: Frontend/android
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: improv-android
          path: |
            Frontend/android/app/build/outputs/apk/debug/*.apk
            Frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
