# IMPROV frontend — nginx site config
# Lives at /etc/nginx/conf.d/default.conf inside the container.
# conf.d is included *inside* the http{} block, so directives like
# limit_req_zone are legal here.

# ---------------------------------------------------------------------------
# Rate limiting (defined at http level)
# ---------------------------------------------------------------------------
# Tuned for the quest-logging endpoint, which is the classic abuse target:
# it awards XP, so it must not be hammerable.
limit_req_zone $binary_remote_addr zone=questlog:10m rate=10r/s;
limit_req_status 429;

# ---------------------------------------------------------------------------
# Upstream
# ---------------------------------------------------------------------------
# "api" is the docker-compose service name. This resolves at container start,
# which is why the api service has a healthcheck and web depends_on it.
upstream improv_api {
    server api:8080;
    keepalive 16;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html LoginPage.html;

    charset utf-8;
    client_max_body_size 10m;

    # -----------------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------------
    # NOTE: no Content-Security-Policy yet. The current app uses inline
    # `onclick=` handlers, which a useful CSP would block. Tightening that
    # is a P2/P3 task once the markup is cleaned up.
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # -----------------------------------------------------------------------
    # Compression
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript text/javascript
                      application/manifest+json image/svg+xml;

    # -----------------------------------------------------------------------
    # Container healthcheck
    # -----------------------------------------------------------------------
    location = /healthz {
        access_log off;
        # default_type, not add_header — add_header would emit a second
        # Content-Type alongside the one nginx already sets.
        default_type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # API reverse proxy
    # -----------------------------------------------------------------------
    # Frontend and backend share one origin, so there is no CORS anywhere.
    # This is also why no JS file should ever hardcode localhost:8080.
    location /api/ {
        proxy_pass         http://improv_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # add_header at location level suppresses the server-level security
        # headers (nginx inheritance rule), so they are repeated here.
        add_header X-Content-Type-Options "nosniff"       always;
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header Referrer-Policy        "no-referrer-when-downgrade" always;

        # Never let a browser or CDN cache an API response by accident.
        add_header Cache-Control "no-store" always;
    }

    # Abuse-sensitive: logging a quest awards XP.
    location ~ ^/api/quests/[^/]+/log$ {
        limit_req zone=questlog burst=20 nodelay;

        proxy_pass         http://improv_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # See the note in location /api/ — the security headers are repeated
        # here because add_header does not inherit into this location.
        add_header X-Content-Type-Options "nosniff"       always;
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header Referrer-Policy        "no-referrer-when-downgrade" always;
        add_header Cache-Control "no-store" always;
    }

    # -----------------------------------------------------------------------
    # Caching
    # -----------------------------------------------------------------------
    # The service worker and the manifest must never be served stale, or
    # installed clients get stuck on an old build.
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # HTML is always revalidated so a deploy is visible immediately.
    location ~* \.html?$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Static assets. These filenames are NOT content-hashed yet, so the TTL is
    # deliberately short. Once the frontend build emits hashed filenames
    # (P2/P3), raise this to `public, max-age=31536000, immutable`.
    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # App shell
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /LoginPage.html;
    }

    # Don't leak the nginx version.
    server_tokens off;
}
