<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="RegistrationPage.css">
    <meta name="description" content="IMPROV — a gamified workout tracker. Track training, earn XP, level up, rank up.">
    <meta name="theme-color" content="#090909">
    <meta name="color-scheme" content="dark">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IMPROV">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="config.js"></script>
</head>
<body>
    
    <header>
        <h1> 
            Get Started with Gamified Fitness Trainer
        </h1>
    </header>

    <form id="registerform">

        <label for="Firstname"> Firstname:</label>
        <input type="text" id="Firstname" required>
        <br>

        <label for="Lastname"> Lastname:</label>
        <input type="text" id="Lastname">
        <br>

        <label for="username"> username:</label>
        <input type="text" id="username" name="username" minlength="5" maxlength="10" pattern="^[A-Za-z0-9]+$" title="Only letters and numbers are allowed" required>
        <br>
         
        <label for="email"> email:</label>
        <input type="email" id="email" placeholder="Enter your Email">
        <br>

        <label for="gender"> gender:</label>

        <label for="Male"> Male</label>
        <input type="radio" id="Male" value="Male" name="gender">

        <label for="Female"> Female</label>
        <input type="radio" id="Female" value="Female" name="gender">
        <br>

        <label for="height"> Height in cm:</label>
        <input type="number" id="height" min="50" max="250" step="0.1">
        <br>
        
        <label for="weight"> Weight in kg:</label>
        <input type="number" id="weight" min="2" max="300" step="0.1">
        <br>
         
        <label for="password"> Password:</label>
        <input type="password" id="password" placeholder="Create a new password" required autocomplete="new-password">
        <br>
        <label for="confirm-password"> Confirm Password:</label>
        <input type="password" id="confirm-password" placeholder="confirm your new password" required autocomplete="new-password">

        <div class="switch-account">
            <span>Already have an account?</span>
            <a href="LoginPage.html">Login</a>
        </div>

        <input type="submit" value="Register">

                   
    </form>  
    
  <script src="RegistrationPage.js"></script>

  <script src="pwa.js"></script>
</body>
</html>
