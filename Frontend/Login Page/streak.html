<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMPROV — Streak</title>
  <link rel="stylesheet" href="theme.css">
  <meta name="description" content="IMPROV — a gamified workout tracker. Track training, earn XP, level up, rank up.">
  <meta name="theme-color" content="#090909">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IMPROV">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="config.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="workout-homepage.html">IMPROV</a>
      <nav class="topnav">
        <a href="workout-homepage.html">Home</a>
        <a href="exercises-detail.html">Exercises</a>
        <a href="analytics.html">Analytics</a>
        <a href="streak.html" class="active">Streak</a>
        <a href="rank.html">Rank</a>
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Log out</button>
      </nav>
    </header>

    <main>
      <div class="stat-grid">
        <div class="card stat-tile"><h3>Current streak</h3><b id="sk-current">0</b><span class="tile-sub">days</span></div>
        <div class="card stat-tile"><h3>Best streak</h3><b id="sk-best">0</b><span class="tile-sub">days</span></div>
      </div>

      <section class="card panel" style="margin-top: 20px">
        <div class="board-head">
          <h2 id="cal-title">Calendar</h2>
          <div>
            <button class="btn btn-ghost btn-sm" id="cal-prev" type="button" aria-label="Previous month">&larr;</button>
            <button class="btn btn-ghost btn-sm" id="cal-next" type="button" aria-label="Next month">&rarr;</button>
          </div>
        </div>
        <div class="calendar" id="cal-grid"></div>
      </section>

      <section class="card panel" style="margin-top: 20px">
        <h2>Timeline</h2>
        <ul class="timeline" id="timeline">
          <li class="muted">No active days yet — complete a quest to start your streak.</li>
        </ul>
      </section>
    </main>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
  <script src="streak.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
