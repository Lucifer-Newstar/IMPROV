<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="LoginPage.css">
    <meta name="description" content="IMPROV — a gamified workout tracker. Track training, earn XP, level up, rank up.">
    <meta name="theme-color" content="#090909">
    <meta name="color-scheme" content="dark">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IMPROV">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="config.js"></script>
</head>
<body>
    <header> 
        <h1>Gamified Fitness Trainer</h1>

        <form id="loginform">

            <Label for="username"> Username:</Label>
            <input type="text" id="username" placeholder="Enter your Username" required>
             <br>
            <Label for="password"> Password:</Label>
            <input type="password" id="password" placeholder="Enter your Password" required autocomplete="current-password">
            <br>
            <input type="submit" value="Login">
            <a href="RegistrationPage.html">Create an Account</a>
            <script src="LoginPage.js"></script>

        </form>
    
      <script src="pwa.js"></script>
</body>
</html>
