# IMPROV — local / single-host stack
#
#   cp .env.example .env      # then edit the passwords
#   docker compose up --build
#   open http://localhost:8080
#
# Frontend and API are served from one origin (nginx), so there is no CORS.

name: improv

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-workoutapp}
      MYSQL_USER: ${DB_USERNAME:-improv}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required - copy .env.example to .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # MYSQL_PWD keeps the password off the command line (and out of `ps`).
      # Single-quoted YAML: compose turns $$ into $, and the shell then sees
      # MYSQL_PWD="$MYSQL_ROOT_PASSWORD" — properly quoted. (Escaped quotes
      # would end up *inside* the password and the check would never pass.)
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    networks: [backend]

  api:
    # `image` names the built image so `docker compose pull` works for deploys
    # (deploy.yml overrides it with API_IMAGE from GHCR). Locally it is just a
    # tag on the image `docker compose up --build` produces.
    image: ${API_IMAGE:-improv-api:local}
    build:
      context: ./Backend/ap
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-workoutapp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-improv}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  web:
    image: ${WEB_IMAGE:-improv-web:local}
    build:
      context: ./Frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

volumes:
  db-data:

networks:
  backend:
    driver: bridge
