# Test profile — no external services required.
#
# The previous setup pointed tests at a live MySQL on 127.0.0.1:3306, so
# `mvn test` could never pass in CI. Tests now run against in-memory H2.

spring.datasource.url=jdbc:h2:mem:improv;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway migrations are MySQL-specific DDL, so tests let Hibernate build the
# schema from the entities instead. Migration correctness is verified
# separately, against a real MySQL, in the CI `migrations` job.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test-only JWT secret (>= 32 bytes for HS256). Never leaves the test profile.
improv.jwt.secret=test-only-jwt-secret-0123456789abcdef0123456789abcdef

logging.level.root=WARN
