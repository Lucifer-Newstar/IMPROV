# Development profile — local machine, or `docker compose -f docker-compose.yml
# -f docker-compose.dev.yml up`.
#
# Diagnostics only. Nothing here should be relied on for correctness.

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,beans,configprops
