spring:
  application:
    name: improv-api

  # `dev` unless something explicitly says otherwise. docker-compose sets
  # SPRING_PROFILES_ACTIVE=prod for the containerised stack.
  profiles:
    default: dev

  # RFC 7807 problem documents for every API error (D9).
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/workoutapp}
    username: ${DB_USERNAME:improv}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000

  jpa:
    # Flyway owns the schema. Hibernate only ever checks that the entities and
    # the database agree — it must never generate DDL outside a migration.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    # A pre-Flyway developer database already has a `users` table. Without this,
    # Flyway refuses to start on a non-empty schema. See docs/DEVOPS.md.
    baseline-on-migrate: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Trust X-Forwarded-* from the nginx reverse proxy so redirects and links
  # are built against the public origin, not the container hostname.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # prometheus is for the internal monitoring stack only — never route
        # /actuator through the public proxy (see docs/DEVOPS.md).
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO

# ---------------------------------------------------------------------------
# IMPROV application config
# ---------------------------------------------------------------------------
improv:
  jwt:
    # HS256 needs at least 32 bytes. There is NO default in any profile — the
    # secret always comes from the environment, and docker-compose enforces it
    # (${JWT_SECRET:?}). A missing secret fails startup loudly, by design.
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 168h
  auth:
    # Secure cookies require https; the dev profile overrides this to false.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: Strict
  quests:
    # Daily XP soft cap: awards past this are halved (anti-abuse, spec §6.5).
    daily-soft-cap: 400
    max-quests-per-day: 5
